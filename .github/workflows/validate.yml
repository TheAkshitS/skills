name: Validate Skills
on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Shellcheck
        if: runner.os == 'Linux'
        run: |
          shopt -s nullglob
          files=(scripts/*.sh scripts/lib/*.sh skills/*/scripts/*.sh skills/*/evals/*.sh)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found to lint."
            exit 0
          fi
          shellcheck -S error "${files[@]}"
      - name: Validate skill frontmatter
        run: bash scripts/validate-skills.sh
      - name: Run validate-skills tests
        run: bash tests/test-validate-skills.sh
      - name: List skills
        run: bash scripts/list-skills.sh
